[package]
name = "deckcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-render = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# WHIQ contract: recovered-file stamps, memory reporting, auto-save on SIGTERM / Ctrl+C.
chrono = { workspace = true }
memory-stats = "1"
ctrlc = { version = "3.4", features = ["termination"] }
