[package]
name = "deckcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft on the command line: render, convert, run commands, inspect, and serve MCP"
publish = false

[lints]
workspace = true

[[bin]]
name = "deckcraft-cli"
path = "src/main.rs"

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-mcp = { workspace = true }
serde_json = { workspace = true }

# WHIQ contract suite: drives the built binary over stdio (tests/mcp-contract/).
[[test]]
name = "mcp_contract"
path = "../../tests/mcp-contract/contract.rs"

[[test]]
name = "mcp_deck"
path = "../../tests/mcp-contract/deck.rs"

[dev-dependencies]
zip = { workspace = true }
image = { workspace = true }
